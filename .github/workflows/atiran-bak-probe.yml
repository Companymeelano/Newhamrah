name: Atiran backup probe

# Runs only when the commit message contains [atiran-bak-probe]. Restores the Atiran2 backup into a
# private SQL Server container on the runner and reads its structure (SELECT only). The live
# Atiran server is never contacted. The result is committed ENCRYPTED (public repository).
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[atiran-bak-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the Atiran backup from main
        run: |
          git fetch --depth=1 origin main
          git show origin/main:Atiran2.zip > "$RUNNER_TEMP/atiran.zip"
          unzip -o -q "$RUNNER_TEMP/atiran.zip" -d "$RUNNER_TEMP/bak"
      - name: Start private SQL Server and copy the backup in
        run: |
          SA="Sa1!$(openssl rand -hex 12)"; echo "::add-mask::$SA"; echo "SA_PASS=$SA" >> "$GITHUB_ENV"
          E2E="E2e7$(openssl rand -hex 6)"; echo "::add-mask::$E2E"; echo "E2E_PASS=$E2E" >> "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" -e MSSQL_COLLATION=Arabic_CI_AS -e MSSQL_PID=Developer -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          docker exec -u 0 mssql mkdir -p /var/opt/mssql/backup
          docker cp "$RUNNER_TEMP/bak/Atiran2" mssql:/var/opt/mssql/backup/Atiran2.bak
          docker exec -u 0 mssql chown -R mssql /var/opt/mssql/backup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Atiran2
        run: |
          pip install --quiet python-tds
          for i in 1 2 3 4; do
            if [ "$(docker inspect -f '{{.State.Running}}' mssql)" != "true" ]; then echo "::notice::mssql stopped, starting again"; docker start mssql; sleep 25; fi
            if python3 .github/scripts/atiran_e2e.py restore "$RUNNER_TEMP/restore.json" > "$RUNNER_TEMP/r.log" 2>&1; then echo "::notice::restore ok (try $i)"; break; fi
            grep -v -i "password" "$RUNNER_TEMP/r.log" | tail -4 | cut -c1-300 | sed 's/^/::notice::restore try '"$i"': /'
            docker logs mssql 2>&1 | grep -v -i password | tail -3 | cut -c1-200 | sed 's/^/::notice::mssql: /'
            sleep 20
          done
          test -s "$RUNNER_TEMP/restore.json"
      - name: Probe (read-only)
        env:
          PROBE_STAGE: ${{ contains(github.event.head_commit.message, '[stage-10]') && '10' || contains(github.event.head_commit.message, '[stage-9]') && '9' || contains(github.event.head_commit.message, '[stage-8]') && '8' || contains(github.event.head_commit.message, '[stage-7]') && '7' || contains(github.event.head_commit.message, '[stage-6]') && '6' || contains(github.event.head_commit.message, '[stage-5]') && '5' || contains(github.event.head_commit.message, '[stage-4]') && '4' || contains(github.event.head_commit.message, '[stage-3]') && '3' || (contains(github.event.head_commit.message, '[stage-2]') && '2' || '1') }}
        run: python3 .github/scripts/atiran_bak_probe.py "$RUNNER_TEMP/bak-probe.json" 2>&1 | grep -v -i password | tail -5
      - name: Encrypt and commit
        if: always()
        run: |
          mkdir -p tools/atiran-bak-probe
          ls -la "$RUNNER_TEMP" | grep -i probe | sed 's/^/::notice::tmp /'
          test -s "$RUNNER_TEMP/bak-probe.json" || echo '{"errors":["no output"]}' > "$RUNNER_TEMP/bak-probe.json"
          gzip -9 -c "$RUNNER_TEMP/bak-probe.json" > "$RUNNER_TEMP/p.gz"; echo "::notice::gzip rc=$?"
          openssl rand -out "$RUNNER_TEMP/k.bin" 32; echo "::notice::rand rc=$?"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/p.gz" -out tools/atiran-bak-probe/probe.json.gz.enc -pass file:"$RUNNER_TEMP/k.bin"; echo "::notice::enc rc=$?"
          openssl pkeyutl -encrypt -pubin -inkey tools/atiran-probe/probe-public-key.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.bin" -out tools/atiran-bak-probe/probe.key.enc; echo "::notice::rsa rc=$?"
          rm -f "$RUNNER_TEMP/k.bin" "$RUNNER_TEMP/p.gz" "$RUNNER_TEMP/bak-probe.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tools/atiran-bak-probe; echo "::notice::add rc=$?"
          git commit -q -m "Atiran backup probe result (encrypted) [skip ci]"; echo "::notice::commit rc=$?"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" 2>&1 | tail -3 | sed 's/^/::notice::pull /'
            if git push -q origin HEAD:${GITHUB_REF_NAME} 2>&1 | tail -3 | sed 's/^/::notice::push /'; then :; fi
            git fetch -q origin "${GITHUB_REF_NAME}"; if git merge-base --is-ancestor HEAD FETCH_HEAD; then echo "::notice::pushed"; break; fi
            sleep 8
          done
