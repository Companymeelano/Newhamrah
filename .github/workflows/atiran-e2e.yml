name: Atiran end-to-end test

# Runs only when the commit message contains [atiran-e2e].
# Restores the Atiran2 backup (Atiran2.zip on main) into a private SQL Server container on the runner,
# runs the real app (debug self-test) on an emulator against that copy, and checks the result with
# Atiran's own procedures. The live Atiran server is never contacted. Results are committed encrypted.
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  e2e:
    if: contains(github.event.head_commit.message, '[atiran-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Get the Atiran backup from main
        run: |
          git fetch --depth=1 origin main
          git show origin/main:Atiran2.zip > "$RUNNER_TEMP/atiran.zip"
          unzip -o -q "$RUNNER_TEMP/atiran.zip" -d "$RUNNER_TEMP/bak"
          ls -la "$RUNNER_TEMP/bak"

      - name: Start private SQL Server and copy the backup in
        run: |
          SA="Sa1!$(openssl rand -hex 12)"; echo "::add-mask::$SA"; echo "SA_PASS=$SA" >> "$GITHUB_ENV"
          E2E="E2e7$(openssl rand -hex 6)"; echo "::add-mask::$E2E"; echo "E2E_PASS=$E2E" >> "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" -e MSSQL_COLLATION=Arabic_CI_AS -e MSSQL_PID=Developer -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          docker exec -u 0 mssql mkdir -p /var/opt/mssql/backup
          docker cp "$RUNNER_TEMP/bak/Atiran2" mssql:/var/opt/mssql/backup/Atiran2.bak
          docker exec -u 0 mssql chown -R mssql /var/opt/mssql/backup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Atiran2
        run: |
          pip install --quiet python-tds
          for i in 1 2 3 4; do
            if [ "$(docker inspect -f '{{.State.Running}}' mssql)" != "true" ]; then echo "::notice::mssql stopped, starting again"; docker start mssql; sleep 25; fi
            if python3 .github/scripts/atiran_e2e.py restore "$RUNNER_TEMP/restore.json" > "$RUNNER_TEMP/r.log" 2>&1; then echo "::notice::restore ok (try $i)"; break; fi
            grep -v -i "password" "$RUNNER_TEMP/r.log" | tail -4 | cut -c1-300 | sed 's/^/::notice::restore try '"$i"': /'
            docker logs mssql 2>&1 | grep -v -i password | tail -3 | cut -c1-200 | sed 's/^/::notice::mssql: /'
            sleep 20
          done
          test -s "$RUNNER_TEMP/restore.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: MEELANO-Android
        run: |
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g assembleDebug
          cp app/build/outputs/apk/visitor/debug/*.apk ../app-debug.apk
          cp app/build/outputs/apk/store/debug/*.apk ../app-store-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app's self-test on an emulator against the copy
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/atiran-e2e.sh e2e

      - name: Verify with Atiran's own procedures
        if: always()
        run: python3 .github/scripts/atiran_e2e.py verify "$RUNNER_TEMP/verify.json"

      - name: Encrypt and commit results
        if: always()
        run: |
          set -e
          mkdir -p tools/atiran-e2e
          cp "$RUNNER_TEMP"/restore.json "$RUNNER_TEMP"/verify.json e2e/ 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/e2e.tgz" e2e
          openssl rand -out "$RUNNER_TEMP/k.bin" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/e2e.tgz" -out tools/atiran-e2e/e2e.tgz.enc -pass file:"$RUNNER_TEMP/k.bin"
          openssl pkeyutl -encrypt -pubin -inkey tools/atiran-probe/probe-public-key.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.bin" -out tools/atiran-e2e/e2e.key.enc
          rm -f "$RUNNER_TEMP/k.bin" "$RUNNER_TEMP/e2e.tgz"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tools/atiran-e2e
          git commit -m "Atiran e2e result (encrypted) [skip ci]" || echo "No changes"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
