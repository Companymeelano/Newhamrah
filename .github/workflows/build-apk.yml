name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.MEELANO_KEYSTORE_BASE64 != '' }}
    outputs:
      version: ${{ steps.src.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android source
        id: src
        run: |
          # A freshly uploaded source zip takes precedence over the folder.
          ZIP=$(ls MEELANO-Android-*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using uploaded zip: $ZIP"; rm -rf MEELANO-Android; unzip -q -o "$ZIP"
          fi
          VERSION=$(grep -oP "versionName\s+'\K[0-9.]+" MEELANO-Android/app/build.gradle)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare release keystore
        env:
          KS_B64: ${{ secrets.MEELANO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MEELANO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEELANO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MEELANO_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "SIGN_STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=${KEY_ALIAS:-meelano}" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASS=${KEY_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "::notice title=Signing::Release APK signed with the MEELANO release key from repository secrets."
          else
            echo "::warning title=Signing::Signing secrets are not configured; release APK will not be published."
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias throwaway \
              -keyalg RSA -keysize 2048 -validity 1 -storepass throwaway -keypass throwaway \
              -dname "CN=throwaway"
            echo "SIGN_STORE_PASS=throwaway" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=throwaway" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASS=throwaway" >> "$GITHUB_ENV"
          fi
          echo "SIGN_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: MEELANO-Android
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-debug.log"; exit ${PIPESTATUS[0]}

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:|\.java:[0-9]+" "$RUNNER_TEMP/gradle-debug.log" | head -20 | while IFS= read -r line; do
            echo "::error title=Compile::${line}"
          done

      - name: Build signed release APK
        working-directory: MEELANO-Android
        run: |
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g assembleRelease \
            -Pandroid.injected.signing.store.file="$SIGN_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGN_STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$SIGN_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS"

      - name: Collect and verify APKs
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          mkdir -p out
          cp MEELANO-Android/app/build/outputs/apk/release/*.apk "out/MEELANO-v$APP_VERSION-release.apk"
          cp MEELANO-Android/app/build/outputs/apk/debug/*.apk "out/MEELANO-v$APP_VERSION-debug.apk"
          cp MEELANO-Android/app/build/outputs/apk/debug/*.apk app-debug.apk
          for f in out/*.apk; do
            R=$("$APKSIGNER" verify --verbose --print-certs "$f" | grep -E "Verified using v[23] |certificate SHA-256" | tr '\n' ';')
            echo "::notice title=apksigner $(basename "$f")::$R"
          done
          if [ "$HAS_SIGNING_KEY" != "true" ]; then rm out/*-release.apk; fi
          rm -f "$SIGN_STORE_FILE"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MEELANO-APK
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-for-screenshots
          path: app-debug.apk
          retention-days: 3

      - name: Commit APK to branch
        if: github.event_name == 'push'
        run: |
          mkdir -p apk
          cp out/*.apk apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apk/*.apk
          git commit -m "Build APK v$APP_VERSION [skip ci]" || echo "No changes"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: MEELANO Android v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*.apk

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: javac warnings (-Xlint:all)
        working-directory: MEELANO-Android
        run: |
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g -Pmeelano.analysis compileDebugJavaWithJavac --rerun-tasks 2>&1 | tee "$RUNNER_TEMP/javac.log" || true

      - name: Android Lint
        working-directory: MEELANO-Android
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g lintDebug || true

      - name: PMD (error-prone + multithreading + performance)
        run: |
          curl -sSL -o pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.7.0/pmd-dist-7.7.0-bin.zip
          unzip -q pmd.zip
          ./pmd-bin-7.7.0/bin/pmd check -d MEELANO-Android/app/src/main/java \
            -R category/java/errorprone.xml,category/java/multithreading.xml,category/java/performance.xml,category/java/bestpractices.xml \
            -f text --no-progress --no-cache -r "$RUNNER_TEMP/pmd.txt" || true

      - name: Commit analysis reports
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/analysis
          grep -E "warning:" "$RUNNER_TEMP/javac.log" | sed "s#^.*/MEELANO-Android/##" > docs/analysis/javac-warnings.txt || true
          cp MEELANO-Android/app/build/reports/lint-results.txt docs/analysis/lint-results.txt 2>/dev/null || find MEELANO-Android/app/build/reports -name "lint-results*.txt" -exec cp {} docs/analysis/lint-results.txt \; || true
          find MEELANO-Android/app/build/reports -name "lint-results*.xml" | head -1 | xargs -r -I{} cp {} docs/analysis/lint-results.xml
          sed "s#^.*/MEELANO-Android/##" "$RUNNER_TEMP/pmd.txt" > docs/analysis/pmd.txt || true
          wc -l docs/analysis/*
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/analysis
          git commit -m "Update static analysis reports [skip ci]" || echo "No changes"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 7; done

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debug-apk-for-screenshots

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh shots && if [ "$UI_REVIEW" = "true" ]; then bash .github/scripts/ui-review.sh review; fi
        env:
          UI_REVIEW: ${{ contains(github.event.head_commit.message, '[ui-review]') }}

      - name: Compress and commit screenshots
        if: github.event_name == 'push'
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          os.makedirs("docs/screenshots", exist_ok=True)
          for f in sorted(glob.glob("shots/*.png")):
              im = Image.open(f).convert("RGB")
              w, h = im.size
              im = im.resize((540, int(h * 540 / w)), Image.LANCZOS)
              out = "docs/screenshots/" + os.path.basename(f)[:-4] + ".jpg"
              im.save(out, "JPEG", quality=82, optimize=True)
              print(out, os.path.getsize(out))
          PY
          cp shots/logcat.txt docs/screenshots/logcat.txt || true
          cp shots/checks.txt docs/screenshots/checks.txt || true
          if [ -d review ]; then
            rm -rf docs/ui-review && mkdir -p docs/ui-review/xml
            python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob("review/*.png")):
              im = Image.open(f).convert("RGB")
              w, h = im.size
              im = im.resize((432, int(h * 432 / w)), Image.LANCZOS)
              im.save("docs/ui-review/" + os.path.basename(f)[:-4] + ".jpg", "JPEG", quality=80, optimize=True)
          PY
            cp review/xml/*.xml docs/ui-review/xml/ || true
            cp review/env.txt review/logcat.txt docs/ui-review/ || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/ui-review 2>/dev/null || git add docs/screenshots
          git commit -m "Update design screenshots [skip ci]" || echo "No changes"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
