name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q -o MEELANO-Android-*.zip -d src
          ls src/MEELANO-Android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release + debug APK
        working-directory: src/MEELANO-Android
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp src/MEELANO-Android/app/build/outputs/apk/release/*.apk out/MEELANO-v4.4.21-release.apk
          cp src/MEELANO-Android/app/build/outputs/apk/debug/*.apk out/MEELANO-v4.4.21-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MEELANO-APK
          path: out/*.apk
