plugins { id 'com.android.application' }

android {
    namespace 'ir.meelano.android'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.meelano.visitor'
        minSdk 24
        targetSdk 36
        versionCode 97
        versionName '5.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        textReport true
        textOutput file("build/reports/lint-results.txt")
        xmlReport true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // Installable APK for direct delivery. Replace with a private release keystore for Play Store publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
}

// Static-analysis runs (CI "analysis" job) pass -Pmeelano.analysis to surface every javac warning.
if (project.hasProperty('meelano.analysis')) {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Xmaxwarns', '5000']
    }
}
