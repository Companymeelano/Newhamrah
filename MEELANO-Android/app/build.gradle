plugins { id 'com.android.application' }

android {
    namespace 'ir.meelano.android'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.meelano.visitor'
        minSdk 24
        targetSdk 35
        versionCode 85
        versionName '4.4.21-persian-font-stock-status'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // Installable APK for direct delivery. Replace with a private release keystore for Play Store publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
}
