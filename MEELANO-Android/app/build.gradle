plugins { id 'com.android.application' }

android {
    namespace 'ir.meelano.android'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.meelano.visitor'
        minSdk 24
        targetSdk 36
        versionCode 105
        versionName '5.9.0'
    }

    // Two installable apps from one code base:
    //  visitor → «Meelano Visit» for the field visitors (unchanged package, updates the old app)
    //  store   → «میلانو فروشگاه» for the store staff (final sales invoice, reports, GPS attendance)
    //  staff   → «پخش درخشان پرسنل» for ordinary personnel (attendance, payroll, leave, advance, own account, deliveries)
    flavorDimensions 'edition'
    productFlavors {
        visitor {
            dimension 'edition'
            applicationId 'ir.meelano.visitor'
        }
        store {
            dimension 'edition'
            applicationId 'ir.meelano.store'
        }
        staff {
            dimension 'edition'
            applicationId 'ir.meelano.staff'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        textReport true
        textOutput file("build/reports/lint-results.txt")
        xmlReport true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // Installable APK for direct delivery. Replace with a private release keystore for Play Store publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}

// Static-analysis runs (CI "analysis" job) pass -Pmeelano.analysis to surface every javac warning.
if (project.hasProperty('meelano.analysis')) {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Xmaxwarns', '5000']
    }
}
