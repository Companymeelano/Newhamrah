plugins { id 'com.android.application' }

android {
    namespace 'ir.meelano.android'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.meelano.visitor'
        minSdk 24
        targetSdk 36
        versionCode 108
        versionName '6.0.1'
    }

    // Two installable apps from one code base:
    //  visitor → «Meelano Visit» for the field visitors (unchanged package, updates the old app)
    //  store   → «میلانو فروشگاه» for the store staff (final sales invoice, reports, GPS attendance)
    //  staff   → «پخش درخشان پرسنل» for ordinary personnel (attendance, payroll, leave, advance, own account, deliveries)
    //  tax     → «پخش درخشان مودیان»: sends Atiran's invoices to the Moadian tax system (MeelanoTaxActivity only)
    flavorDimensions 'edition'
    productFlavors {
        visitor {
            dimension 'edition'
            applicationId 'ir.meelano.visitor'
        }
        store {
            dimension 'edition'
            applicationId 'ir.meelano.store'
        }
        staff {
            dimension 'edition'
            applicationId 'ir.meelano.staff'
        }
        tax {
            dimension 'edition'
            applicationId 'ir.meelano.tax'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        textReport true
        textOutput file("build/reports/lint-results.txt")
        xmlReport true
    }

    // One fixed key for every build, so a new version always installs over the previous one (no uninstall, no data
    // loss). CI overrides it with the private MEELANO release key when the repository secrets are configured.
    signingConfigs {
        install {
            storeFile file('signing/meelano-install.p12')
            storeType 'pkcs12'
            storePassword 'derakhshan-install'
            keyAlias 'meelano'
            keyPassword 'derakhshan-install'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.install
        }
        release {
            // Installable APK for direct delivery (fixed key above, or the private release key injected by CI).
            signingConfig signingConfigs.install
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}

// Static-analysis runs (CI "analysis" job) pass -Pmeelano.analysis to surface every javac warning.
if (project.hasProperty('meelano.analysis')) {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Xmaxwarns', '5000']
    }
}
